<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário Fomatis AI</title>
  <link rel="icon" href="favicon1.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #3d4ff7;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: opacity 1s ease;
    }

    .container {
      background: rgba(0, 0, 0, 0.3);
      padding: 30px;
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      color: #fff;
      position: relative;
      z-index: 2;
    }

    h2, h3 {
      color: #fff;
      text-align: center;
    }

    .section {
      margin-bottom: 20px;
      text-align: center;
    }

    .input-box {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 8px;
      border: 2px solid #ccc;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #f0f0f0;
      color: #222;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      text-align: center;
      z-index: 1;
      font-weight: bold;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .btn div {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
      font-weight: normal;
    }

    .btn.selected {
      color: #000;
      background: #fff;
      z-index: 10;
      position: relative;
      animation: rainbow-glow 2.5s linear infinite;
    }

    @keyframes rainbow-glow {
      0%   { box-shadow: 0 0 16px rgba(255, 0, 0, 0.8); }
      25%  { box-shadow: 0 0 16px rgba(255, 165, 0, 0.8); }
      50%  { box-shadow: 0 0 16px rgba(0, 255, 0, 0.8); }
      75%  { box-shadow: 0 0 16px rgba(0, 0, 255, 0.8); }
      100% { box-shadow: 0 0 16px rgba(238, 130, 238, 0.8); }
    }

    .hidden {
      display: none;
    }

    .submit-btn {
      margin-top: 30px;
      display: flex;
      justify-content: center;
    }

    #enviarBtn {
      background: transparent;
      color: white;
      border: 2px solid white;
      position: relative;
      overflow: hidden;
    }

    .rocket {
      position: absolute;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 40px;
      opacity: 0;
      z-index: 10;
    }

    .rocket.active {
      animation: rocketUp 1.5s ease forwards;
    }

    @keyframes rocketUp {
      0% { bottom: -80px; opacity: 0; }
      30% { opacity: 1; }
      100% { bottom: 100vh; opacity: 0; }
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="rocket" id="rocket">🚀</div>

  <div class="container">
    <h2>O que deseja aprender?</h2>
    <input type="text" class="input-box" placeholder="Digite aqui...">

    <div class="section">
      <h3>Como deseja ver o conteúdo?</h3>
      <div class="btn-group" id="tipoConteudo">
        <div class="btn" data-value="video">Vídeo</div>
        <div class="btn" data-value="artigo">Artigo</div>
        <div class="btn" data-value="ambos">Ambos</div>
      </div>
    </div>

    <div class="section hidden" id="duracaoSection">
      <h3>Tempo de duração</h3>
      <div class="btn-group" id="duracaoBtns">
        <div class="btn" data-value="curto">
          Curto
          <div>10 - 15 min</div>
        </div>
        <div class="btn" data-value="medio">
          Médio
          <div>20 - 25 min</div>
        </div>
        <div class="btn" data-value="longo">
          Longo
          <div>30+ min</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Nível de conhecimento</h3>
      <div class="btn-group" id="nivelBtns">
        <div class="btn" data-value="basico">Básico</div>
        <div class="btn" data-value="medio">Médio</div>
        <div class="btn" data-value="avancado">Avançado</div>
      </div>
    </div>

    <div class="submit-btn">
      <button id="enviarBtn" class="btn"><span>Enviar</span></button>
    </div>
  </div>

  <script>
    function handleSelection(groupId) {
      const buttons = document.querySelectorAll(`#${groupId} .btn`);
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
      });
    }

    handleSelection('tipoConteudo');
    handleSelection('duracaoBtns');
    handleSelection('nivelBtns');

    const tipoBtns = document.querySelectorAll('#tipoConteudo .btn');
    const duracaoSection = document.getElementById('duracaoSection');

    tipoBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tipo = btn.dataset.value;
        const duracaoBtns = document.querySelectorAll('#duracaoBtns .btn');

        if (tipo === 'video' || tipo === 'ambos') {
          duracaoSection.classList.remove('hidden');
        } else {
          duracaoSection.classList.add('hidden');
          duracaoBtns.forEach(b => b.classList.remove('selected'));
        }
      });
    });

    document.getElementById("enviarBtn").addEventListener("click", () => {
      document.getElementById("rocket").classList.add("active");
      document.body.classList.add("fade-out");

      setTimeout(() => {
        window.location.href = "file:///C:/Users/gusta/OneDrive/%C3%81rea%20de%20Trabalho/tela.html";
      }, 1500);
    });
  </script>

</body>
</html>
