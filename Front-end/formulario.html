<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário Fomatis AI</title>
  <link rel="icon" href="favicon1.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #3d4ff7 0%, #2a3bd4 100%);
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: opacity 1s ease;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      z-index: 1;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      max-width: 800px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      color: #333;
      position: relative;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h2, h3 {
      color: #3d4ff7;
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 2.2rem;
      margin-bottom: 30px;
      font-weight: 700;
    }

    h3 {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .section {
      margin-bottom: 30px;
      text-align: center;
    }

    .input-box {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      background: white;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-box:focus {
      border-color: #3d4ff7;
      box-shadow: 0 0 0 3px rgba(61, 79, 247, 0.1);
      transform: translateY(-2px);
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .btn {
      padding: 14px 24px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: white;
      color: #555;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      text-align: center;
      z-index: 1;
      font-weight: 600;
      flex: 1;
      min-width: 120px;
      max-width: 180px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      border-color: #e0e0e0;
      color: #555;
    }

    .btn div {
      font-size: 12px;
      color: #777;
      margin-top: 6px;
      font-weight: normal;
    }

    .btn.selected {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(61, 79, 247, 0.3);
      animation: rainbow-glow 2.5s linear infinite;
    }

    @keyframes rainbow-glow {
      0%   { box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
      25%  { box-shadow: 0 0 20px rgba(255, 165, 0, 0.6); }
      50%  { box-shadow: 0 0 20px rgba(0, 255, 0, 0.6); }
      75%  { box-shadow: 0 0 20px rgba(0, 0, 255, 0.6); }
      100% { box-shadow: 0 0 20px rgba(238, 130, 238, 0.6); }
    }

    .hidden {
      display: none;
    }

    .submit-btn {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #enviarBtn {
      background: linear-gradient(135deg, #3d4ff7, #2a3bd4);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(61, 79, 247, 0.3);
    }

    #enviarBtn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(61, 79, 247, 0.4);
    }

    #enviarBtn:active {
      transform: translateY(-1px);
    }

    .fade-out {
      opacity: 0;
    }

    .sticker {
      font-size: 24px;
      margin-bottom: 8px;
      display: block;
    }

    .error-message {
      color: red;
      margin-top: 10px;
      font-weight: 600;
      text-align: center;
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
        width: 95%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>O que deseja aprender?</h2>
    <input type="text" class="input-box" id="campoTexto" placeholder="Digite aqui...">

    <div class="section">
      <h3>Como deseja ver o conteúdo?</h3>
      <div class="btn-group" id="tipoConteudo">
        <div class="btn" data-value="video">
          <span class="sticker">🎥</span>
          Vídeo
        </div>
        <div class="btn" data-value="artigo">
          <span class="sticker">📄</span>
          Artigo
        </div>
        <div class="btn" data-value="ambos">
          <span class="sticker">📚</span>
          Ambos
        </div>
      </div>
    </div>

    <div class="section hidden" id="duracaoSection">
      <h3>Tempo de duração</h3>
      <div class="btn-group" id="duracaoBtns">
        <div class="btn" data-value="curto"><span class="sticker">⏱️</span>Curto<div>10 - 15 min</div></div>
        <div class="btn" data-value="medio"><span class="sticker">⏱️⏱️</span>Médio<div>20 - 25 min</div></div>
        <div class="btn" data-value="longo"><span class="sticker">⏱️⏱️⏱️</span>Longo<div>30+ min</div></div>
      </div>
    </div>

    <div class="section">
      <h3>Nível de conhecimento</h3>
      <div class="btn-group" id="nivelBtns">
        <div class="btn" data-value="basico"><span class="sticker">🟢</span>Básico</div>
        <div class="btn" data-value="medio"><span class="sticker">🟡</span>Médio</div>
        <div class="btn" data-value="avancado"><span class="sticker">🔴</span>Avançado</div>
      </div>
    </div>

    <div class="submit-btn">
      <button id="enviarBtn" class="btn"><span>Enviar</span></button>
      <div id="mensagemErro" class="error-message hidden"></div>
    </div>
  </div>

  <script>
    function handleSelection(groupId) {
      const buttons = document.querySelectorAll(`#${groupId} .btn`);
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
      });
    }

    handleSelection('tipoConteudo');
    handleSelection('duracaoBtns');
    handleSelection('nivelBtns');

    const tipoBtns = document.querySelectorAll('#tipoConteudo .btn');
    const duracaoSection = document.getElementById('duracaoSection');

    tipoBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tipo = btn.dataset.value;
        const duracaoBtns = document.querySelectorAll('#duracaoBtns .btn');

        if (tipo === 'video' || tipo === 'ambos') {
          duracaoSection.classList.remove('hidden');
        } else {
          duracaoSection.classList.add('hidden');
          duracaoBtns.forEach(b => b.classList.remove('selected'));
        }
      });
    });

    const enviarBtn = document.getElementById("enviarBtn");
    const mensagemErro = document.getElementById("mensagemErro");
    const campoTexto = document.getElementById("campoTexto");

    enviarBtn.addEventListener("click", () => {
      mensagemErro.classList.add("hidden");
      mensagemErro.textContent = "";

      const texto = campoTexto.value.trim();
      const tipoSelecionado = document.querySelector("#tipoConteudo .btn.selected");
      const nivelSelecionado = document.querySelector("#nivelBtns .btn.selected");
      const duracaoVisivel = !duracaoSection.classList.contains("hidden");
      const duracaoSelecionada = document.querySelector("#duracaoBtns .btn.selected");

      let erros = [];

      if (!texto) erros.push("Digite o que deseja aprender.");
      if (!tipoSelecionado) erros.push("Selecione o tipo de conteúdo.");
      if (!nivelSelecionado) erros.push("Selecione o nível de conhecimento.");
      if (duracaoVisivel && !duracaoSelecionada) erros.push("Selecione a duração desejada.");

      if (erros.length > 0) {
        mensagemErro.textContent = erros.join(" ");
        mensagemErro.classList.remove("hidden");
        return;
      }

      // Se tudo estiver preenchido:
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = "file:///C:/Users/gusta/OneDrive/%C3%81rea%20de%20Trabalho/tela%20gerando.html";
      }, 1500);
    });
  </script>

</body>
</html>
