<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário Fomatis AI</title>
  <link rel="icon" href="favicon1.png" type="image/png">
  <link rel="stylesheet" href="../css/formulario.css">
</head>
<body>

  <div class="container">
    <h2>O que deseja aprender?</h2>
    <input type="text" class="input-box" id="campoTexto" placeholder="Digite aqui...">

    <div class="section">
      <h3>Como deseja ver o conteúdo?</h3>
      <div class="btn-group" id="tipoConteudo">
        <div class="btn" data-value="video">
          <span class="sticker">🎥</span>
          Vídeo
        </div>
        <div class="btn" data-value="artigo">
          <span class="sticker">📄</span>
          Artigo
        </div>
        <div class="btn" data-value="ambos">
          <span class="sticker">📚</span>
          Ambos
        </div>
      </div>
    </div>

    <div class="section hidden" id="duracaoSection">
      <h3>Tempo de duração</h3>
      <div class="btn-group" id="duracaoBtns">
        <div class="btn" data-value="curto"><span class="sticker">⏱️</span>Curto<div>10 - 15 min</div></div>
        <div class="btn" data-value="medio"><span class="sticker">⏱️⏱️</span>Médio<div>20 - 25 min</div></div>
        <div class="btn" data-value="longo"><span class="sticker">⏱️⏱️⏱️</span>Longo<div>30+ min</div></div>
      </div>
    </div>

    <div class="section">
      <h3>Nível de conhecimento</h3>
      <div class="btn-group" id="nivelBtns">
        <div class="btn" data-value="basico"><span class="sticker">🟢</span>Básico</div>
        <div class="btn" data-value="medio"><span class="sticker">🟡</span>Médio</div>
        <div class="btn" data-value="avancado"><span class="sticker">🔴</span>Avançado</div>
      </div>
    </div>

    <div class="submit-btn">
      <button id="enviarBtn" class="btn"><span>Enviar</span></button>
      <div id="mensagemErro" class="error-message hidden"></div>
    </div>
  </div>

  <script src="../js/formulario.js"></script>

</body>
</html>
