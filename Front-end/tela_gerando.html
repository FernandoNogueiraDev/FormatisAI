<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerando trilha com IA</title>
  <link rel="icon" href="imgs/favicon1.png" type="image/png">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0d1b3d;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.4);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    .message {
      font-size: 22px;
      margin-bottom: 30px;
      animation: fadeIn 1s ease-in-out;
    }

    .core {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 30px;
      background: radial-gradient(circle at center, #ffffff 0%, #00ffff 100%);
      animation: rotateCore 6s linear infinite, pulseGlow 2.5s ease-in-out infinite, scaleUp 3s ease-in-out infinite;
    }

    @keyframes rotateCore {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0%   { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
      50%  { box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); }
      100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
    }

    @keyframes scaleUp {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .phrases {
      margin-top: 30px;
      font-size: 16px;
      opacity: 0.7;
      animation: fadePhrase 10s linear infinite;
    }

    @keyframes fadePhrase {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      40%  { opacity: 1; }
      50%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .stickers {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .sticker {
      position: absolute;
      font-size: 28px;
      opacity: 0.3;
      animation: float 14s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 0.3; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-100vh); opacity: 0.3; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>

  <div class="container">
    <div class="message">Aguarde enquanto geramos sua trilha personalizada</div>
    <div class="core"></div>
    <div class="phrases" id="phrase">Estamos preparando sua trilha personalizada com IA.</div>
  </div>

  <div class="stickers" id="stickers"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
   

  
  <script>
    
    const phrases = [
      "Estamos preparando sua trilha personalizada com IA.",
      "Analisando seu perfil de aprendizado...",
      "Conectando conhecimento aos seus objetivos...",
      "Montando seu caminho ideal de estudos...",
      "Quase lá! Finalizando os ajustes..."
    ];

    let index = 0;
    const phraseElement = document.getElementById("phrase");

    setInterval(() => {
      index = (index + 1) % phrases.length;
      phraseElement.textContent = phrases[index];
    }, 5000);

    // Stickers aleatórios
    const icons = ["🧠", "📘", "🚀", "💡", "🔍"];
    const stickersContainer = document.getElementById("stickers");

    for (let i = 0; i < 25; i++) {
      const icon = icons[Math.floor(Math.random() * icons.length)];
      const sticker = document.createElement("div");
      sticker.className = "sticker";
      sticker.textContent = icon;
      sticker.style.left = `${Math.random() * 100}%`;
      sticker.style.animationDelay = `${Math.random() * 10}s`;
      stickersContainer.appendChild(sticker);
    }

    // Partículas animadas no fundo
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 100; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        dx: (Math.random() - 0.5) * 0.5,
        dy: (Math.random() - 0.5) * 0.5
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(drawParticles);
    }

    drawParticles();

   // Recuperar os dados do localStorage
        function carregarDadosCurso() {
            const dadosSalvos = localStorage.getItem('cursoPersonalizado');
            
            if (dadosSalvos) {
                const curso = JSON.parse(dadosSalvos);
                const cursoDetails = document.getElementById('cursoDetails');
                
              
                 console.log("Dados do formulário para enviar:", dadosSalvos);

                
                $.ajax({
    type: "POST",
    url: '../controller/TrilhaController.php', 
    data: { tema: curso["tema"], tipo: curso["tipo"], nivel: curso["nivel"], duracao: curso["duracao"] }, 
    success: function(response) {
        // Handle successful response
        console.log("Success:", response);
        window.location.href = "minhastrilhas.html?idTrilha=" +response;
        // Update UI, display success message, etc.
    },
    error: function(jqXHR, textStatus, errorThrown) {
        // This is still needed for handling errors
    }
});
                
            } else {
                
                alert('Nenhum curso encontrado. Voltando para a página inicial.');
                window.location.href = 'telainicial.php';
            }
        }

        // Funções auxiliares para formatar os valores
        function formatarTipo(tipo) {
            const tipos = {
                'video': '🎥 Vídeo',
                'artigo': '📝 Artigo', 
                'ambos': '📚 Vídeo + Artigo'
            };
            return tipos[tipo] || tipo;
        }

        function formatarNivel(nivel) {
            const niveis = {
                'basico': '👶 Básico',
                'medio': '🚶 Intermediário',
                'avancado': '🏃 Avançado'
            };
            return niveis[nivel] || nivel;
        }

        function formatarDuracao(duracao) {
            const duracoes = {
                'curto': '⏱ 10-15 minutos',
                'medio': '🕒 20-25 minutos',
                'longo': '⏳ 30+ minutos'
            };
            return duracoes[duracao] || duracao;
        }

        function voltarParaHome() {
            window.location.href = 'telainicial.php';
        }

        function verProgresso() {
            alert('Em desenvolvimento - acompanhe o progresso da geração do seu curso!');
        }

        // Carregar dados quando a página carregar
        document.addEventListener('DOMContentLoaded', carregarDadosCurso);




  </script>

</body>
</html>
