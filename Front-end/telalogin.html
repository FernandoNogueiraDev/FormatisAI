<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formatis - Login</title>
  <link rel="icon" href="imgs/favicon1.png" type="image/png">
  <style>
    /* ====== VARIÁVEIS CSS ====== */
    :root {
      --primary-color: #3d4ff7;
      --secondary-color: #ffca28;
      --light-color: #eef2ff;
      --dark-color: #333;
      --gray-color: #f5f5f5;
      --white: #fff;
      --error-color: #e74c3c;
      --success-color: #2ecc71;
      --border-radius: 12px;
      --transition: all 0.3s ease;
      --shadow: 0 4px 15px rgba(0,0,0,0.1);
      --shadow-hover: 0 8px 25px rgba(0,0,0,0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      background: linear-gradient(135deg, var(--primary-color), #00bcd4);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--white);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><polygon fill="rgba(255,255,255,0.05)" points="0,1000 1000,0 1000,1000"/></svg>');
      background-size: cover;
      z-index: 1;
    }

    /* ====== CONTAINER DE LOGIN ====== */
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 50px 40px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-hover);
      width: 100%;
      max-width: 450px;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeInUp 0.8s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeInUp {
      from { 
        opacity: 0; 
        transform: translateY(30px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    .logo {
      margin-bottom: 30px;
    }

    .logo img {
      height: 60px;
      width: auto;
    
    }

    h2 {
      color: var(--primary-color);
      margin-bottom: 10px;
      font-size: 2rem;
      font-weight: 700;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    /* ====== FORMULÁRIO ====== */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark-color);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .input-with-icon {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 1rem;
      z-index: 3; /* Fica acima do input */
      pointer-events: none; /* Não interfere com cliques */
      transition: var(--transition);
    }

    input:focus + .input-icon {
      color: var(--primary-color);
      transform: translateY(-50%) scale(1.1);
    }

    input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 2px solid #e0e0e0;
      border-radius: var(--border-radius);
      font-size: 0.95rem;
      transition: var(--transition);
      background-color: var(--white);
      color: var(--dark-color);
      position: relative;
      z-index: 2; /* Fica abaixo do ícone */
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(61, 79, 247, 0.1);
      transform: translateY(-2px);
    }

    input::placeholder {
      color: #999;
    }

    /* ====== BOTÕES ====== */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      margin-top: 25px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--border-radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), #2a3bd4);
      color: var(--white);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(61, 79, 247, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
    }

    .btn-secondary:hover {
      background: var(--primary-color);
      color: var(--white);
      transform: translateY(-3px);
    }

    .btn-loading {
      position: relative;
      pointer-events: none;
    }

    .btn-loading::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top: 2px solid currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ====== LINKS ADICIONAIS ====== */
    .login-links {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .login-links a {
      color: var(--primary-color);
      text-decoration: none;
      transition: var(--transition);
      font-weight: 500;
    }

    .login-links a:hover {
      color: #2a3bd4;
      text-decoration: underline;
    }

    /* ====== MENSAGEM DE ERRO ====== */
    .error {
      color: var(--error-color);
      font-size: 0.9rem;
      margin-top: 15px;
      padding: 12px;
      background-color: rgba(231, 76, 60, 0.1);
      border-radius: 8px;
      border-left: 4px solid var(--error-color);
      text-align: left;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .success {
      color: var(--success-color);
      font-size: 0.9rem;
      margin-top: 15px;
      padding: 12px;
      background-color: rgba(46, 204, 113, 0.1);
      border-radius: 8px;
      border-left: 4px solid var(--success-color);
    }

    /* ====== VISITANTE ====== */
    .guest-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }

    .btn-ghost {
      background: transparent;
      color: #666;
      border: 1px solid #ddd;
    }

    .btn-ghost:hover {
      background: #f5f5f5;
      color: var(--dark-color);
      transform: translateY(-2px);
    }

    /* ====== RESPONSIVIDADE ====== */
    @media (max-width: 768px) {
      body {
        padding: 15px;
      }
      
      .login-container {
        padding: 40px 30px;
        max-width: 400px;
      }
      
      h2 {
        font-size: 1.8rem;
      }
      
      .logo img {
        height: 50px;
      }
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
      
      h2 {
        font-size: 1.6rem;
      }
      
      .subtitle {
        font-size: 1rem;
      }
      
      input, .btn {
        padding: 12px;
      }
      
      .login-links {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }

    /* ====== ANIMAÇÃO DE CARREGAMENTO ====== */
    .loading-dots {
      display: inline-block;
      position: relative;
    }

    .loading-dots::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo">
    <img src="imgs/logo.png" alt="Formatis" onerror="this.src='https://via.placeholder.com/200/3d4ff7/ffffff?text=Formatis'">
  </div>
  
  <h2>Bem-vindo de volta!</h2>
  <p class="subtitle">Faça login para continuar sua jornada de aprendizado</p>
  
  <form id="loginForm">
    <div class="form-group">
      <label for="username">E-mail ou usuário</label>
      <div class="input-with-icon">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="seu@email.com" autocomplete="username">
      </div>
    </div>
    
    <div class="form-group">
      <label for="password">Senha</label>
      <div class="input-with-icon">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password">
      </div>
    </div>
    
    <div class="button-group">
      <button type="button" class="btn btn-primary" onclick="login()" id="loginBtn">
        <span>🚀 Entrar na Plataforma</span>
      </button>
      <button type="button" class="btn btn-secondary" onclick="cadastro()">
        <span>📝 Criar Nova Conta</span>
      </button>
    </div>
  </form>
  
  <div class="login-links">
    <a href="#" onclick="esqueciSenha()">🔓 Esqueci minha senha</a>
    <a href="#" onclick="continuarComoVisitante()">👀 Continuar como visitante</a>
  </div>
  
  <div class="guest-section">
    <p style="color: #666; margin-bottom: 15px; font-size: 0.9rem;">
      Quer apenas explorar?
    </p>
    <button type="button" class="btn btn-ghost" onclick="continuarComoVisitante()">
      <span>🔍 Explorar como Visitante</span>
    </button>
  </div>
  
  <div id="error-message" class="error" style="display: none;"></div>
  <div id="success-message" class="success" style="display: none;"></div>
</div>

<script>
let isLoading = false;

function setLoading(state) {
  isLoading = state;
  const loginBtn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('error-message');
  
  if (state) {
    loginBtn.innerHTML = '<span class="loading-dots">Entrando</span>';
    loginBtn.classList.add('btn-loading');
    errorMsg.style.display = 'none';
  } else {
    loginBtn.innerHTML = '<span>🚀 Entrar na Plataforma</span>';
    loginBtn.classList.remove('btn-loading');
  }
}

function showMessage(message, type = 'error') {
  const errorMsg = document.getElementById('error-message');
  const successMsg = document.getElementById('success-message');
  
  if (type === 'error') {
    errorMsg.textContent = message;
    errorMsg.style.display = 'block';
    successMsg.style.display = 'none';
  } else {
    successMsg.textContent = message;
    successMsg.style.display = 'block';
    errorMsg.style.display = 'none';
  }
}

function login() {
  if (isLoading) return;
  
  const email = document.getElementById('username').value.trim();
  const senha = document.getElementById('password').value.trim();
  
  // Validação básica
  if (!email || !senha) {
    showMessage('Por favor, preencha todos os campos.');
    return;
  }
  
  if (!email.includes('@')) {
    showMessage('Por favor, insira um e-mail válido.');
    return;
  }
  
  setLoading(true);
  
  const formData = new FormData();
  formData.append('email', email);
  formData.append('senha', senha);
  
  fetch('login.php', { 
    method: 'POST', 
    body: formData 
  })
    .then(res => {
      if (!res.ok) throw new Error('Erro na rede');
      return res.text();
    })
    .then(r => {
      if (r === 'success') {
        showMessage('Login realizado com sucesso! Redirecionando...', 'success');
        setTimeout(() => {
          window.location.href = 'telainicial.php';
        }, 1000);
      } else {
        showMessage(r || 'Credenciais inválidas. Tente novamente.');
      }
    })
    .catch((error) => { 
      showMessage('Erro de conexão com o servidor. Tente novamente.');
      console.error('Erro:', error);
    })
    .finally(() => {
      setLoading(false);
    });
}

function cadastro() {
  if (isLoading) return;
  window.location.href = 'index.html';
}

function esqueciSenha() {
  showMessage('Em breve: Você poderá redefinir sua senha por e-mail!', 'success');
}

function continuarComoVisitante() {
  if (isLoading) return;
  showMessage('Entrando como visitante...', 'success');
  setTimeout(() => {
    window.location.href = 'telainicial.php';
  }, 1000);
}

// Melhorias de UX
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('loginForm');
  const inputs = form.querySelectorAll('input');
  
  // Enter para submeter
  inputs.forEach(input => {
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        login();
      }
    });
  });
  
  // Foco automático no primeiro campo
  document.getElementById('username').focus();
  
  // Limpar mensagens ao digitar
  inputs.forEach(input => {
    input.addEventListener('input', function() {
      const errorMsg = document.getElementById('error-message');
      const successMsg = document.getElementById('success-message');
      if (errorMsg.style.display !== 'none' || successMsg.style.display !== 'none') {
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
      }
    });
  });
});
</script>

</body>
</html>
