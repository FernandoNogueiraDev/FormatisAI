<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Formatis</title>
  <link rel="icon" href="imgs/favicon1.png" type="image/png">
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>

<div class="register-container">
  <div class="logo">
    <img src="imgs/logo.png" alt="Formatis">
  </div>
  
  <h2>Junte-se à Formatis</h2>
  <p class="subtitle">Crie sua conta e comece sua jornada de aprendizado personalizado</p>
  
  <form id="registerForm">
  <div class="form-grid">

    <!-- COLUNA ESQUERDA -->
    <div class="form-column">

      <div class="form-group">
        <label for="nome">Nome completo</label>
        <div class="input-with-icon">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="nome" 
            placeholder="Seu nome completo" 
            autocomplete="name" 
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="dataNascimento">Data de nascimento</label>
        <div class="input-with-icon">
          <span class="input-icon">🎂</span>
          <input 
            type="date" 
            id="dataNascimento" 
            name="dataNascimento"
            required
          >
        </div>
      </div>

    </div>

    <!-- COLUNA DIREITA -->
    <div class="form-column">

      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-with-icon">
          <span class="input-icon">📧</span>
          <input 
            type="email" 
            id="email" 
            placeholder="seu@email.com" 
            autocomplete="email" 
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="senha" 
            placeholder="Crie uma senha segura" 
            autocomplete="new-password" 
            required
          >
        </div>
      </div>

    </div>

  </div>
</form>
      
      <div class="toggle-container">
        <div class="toggle-label">Tipo de aluno</div>
        <div class="toggle-switch" id="tipoAlunoToggle">
          <div class="toggle-slider"></div>
          <div class="toggle-option" data-value="autodidata">👨‍🎓 Autodidata</div>
          <div class="toggle-option" data-value="escolar">🏫 Escolar</div>
        </div>
      </div>
      
      <div class="upload-container" id="uploadContainer">
        <label for="historicoUpload">Histórico escolar (opcional)</label>
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📁</div>
          <div class="upload-text">Arraste ou clique para fazer upload</div>
          <button type="button" class="upload-button">Selecionar arquivo</button>
          <div class="file-name" id="fileName">Nenhum arquivo selecionado</div>
        </div>
        <input type="file" id="historicoUpload" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
      </div>
      
      <div class="button-group">
        <button type="submit" class="btn btn-primary" id="registerBtn">
          <span>🚀 Criar Minha Conta</span>
        </button>
        <button type="button" class="btn btn-secondary" onclick="voltarParaLogin()">
          <span>↩️ Voltar para o Login</span>
        </button>
      </div>
      
      <div id="message" class="message" style="display: none;"></div>
      
      <div class="login-link">
        Já tem uma conta? <a href="telalogin.html">Faça login aqui</a>
      </div>
    </div>
  </form>
</div>
<script src="../js/index.js"></script>
</body>
</html>
