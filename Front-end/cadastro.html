<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Formatis</title>
  <link rel="icon" href="imgs/favicon1.png" type="image/png">
  <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

<div class="register-page">

  <!-- HERO -->
  <header class="register-hero">
    <div class="register-logo">
      <img src="imgs/logo.png" alt="Formatis"
           onerror="this.src='https://via.placeholder.com/200/3d4ff7/ffffff?text=Formatis'">
    </div>
    <h1>Junte-se à Formatis</h1>
    <p>Crie sua conta e comece sua jornada de aprendizado</p>
  </header>

  <!-- CARD -->
  <main class="register-card">
    <form id="registerForm">

      <!-- Linha 1: Nome + Data -->
      <div class="row-2">
        <div class="field">
          <label for="nome">Nome completo</label>
          <div class="input-wrap">
            <span class="input-ico">👤</span>
            <input type="text" id="nome" placeholder="Seu nome completo"
                   autocomplete="name" required>
          </div>
        </div>

        <div class="field">
          <label for="dataNascimento">Data de nascimento</label>
          <div class="input-wrap">
            <span class="input-ico">🎂</span>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
          </div>
        </div>
      </div>

      <!-- Linha 2: Email + Senha -->
      <div class="row-2">
        <div class="field">
          <label for="email">E-mail</label>
          <div class="input-wrap">
            <span class="input-ico">📧</span>
            <input type="email" id="email" placeholder="seu@email.com"
                   autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="input-wrap">
            <span class="input-ico">🔒</span>
            <input type="password" id="senha" placeholder="Crie uma senha segura"
                   autocomplete="new-password" required>
            <button type="button" class="toggle-pass" id="togglePass"
                    onclick="toggleSenha()" aria-label="Mostrar senha">👁</button>
          </div>
        </div>
      </div>

      <!-- Tipo de aluno -->
      <div class="field">
        <label>Tipo de aluno</label>
        <div class="tipo-toggle" id="tipoAlunoToggle">
          <div class="tipo-toggle__slider"></div>
          <div class="tipo-toggle__opt active" data-value="autodidata">👨‍🎓 Autodidata</div>
          <div class="tipo-toggle__opt" data-value="escolar">🏫 Escolar</div>
        </div>
      </div>

      <!-- Upload (só aparece se escolar) -->
      <div class="upload-container" id="uploadContainer">
        <label>Histórico escolar (opcional)</label>
        <div class="upload-area" id="uploadArea">
          <div class="upload-ico">📁</div>
          <div class="upload-text">Arraste ou clique para enviar</div>
          <div class="file-name" id="fileName">Nenhum arquivo selecionado</div>
        </div>
        <input type="file" id="historicoUpload"
               accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
      </div>

      <!-- Botão principal -->
      <button type="submit" class="btn-primario" id="registerBtn">
        <span class="btn-primario__txt">🚀 Criar minha conta</span>
        <span class="btn-primario__load" style="display:none;">
          <span class="spinner"></span> Criando...
        </span>
      </button>

      <div class="divisor"><span>ou</span></div>

      <!-- Voltar para login -->
      <button type="button" class="btn-visitante" onclick="voltarParaLogin()">
        ↩ Voltar para o login
      </button>

      <div id="message" class="message" style="display: none;"></div>

    </form>
  </main>

  <p class="register-copy">
    Já tem conta?
    <a href="telalogin.php">Faça login</a>
  </p>

</div>

<script src="../js/cadastro.js"></script>
</body>
</html>
