<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparando seu ambiente</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #050810;
}
body {
  font-family: "Segoe UI", Inter, system-ui, Arial, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}

.screen {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(30,55,130,.09), transparent 65%),
    #050810;
  transition: opacity 1.4s ease, filter 1.4s ease;
  z-index: 10;
}
.screen.finish {
  opacity: 0;
  filter: blur(8px);
  pointer-events: none;
}
.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 48%, rgba(0,0,0,.55) 100%);
  z-index: 4;
}

#dotGrid {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 1;
}

.aura {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(900px, 130vw);
  height: min(900px, 130vw);
  background: radial-gradient(circle,
    rgba(80,150,255,.13) 0%,
    rgba(60,120,220,.05) 40%,
    transparent 68%);
  pointer-events: none;
  z-index: 3;
  opacity: 0;
  transition: opacity 1.6s ease;
}

.corner {
  position: absolute;
  width: 22px; height: 22px;
  border: 1px solid rgba(100,150,220,.18);
  z-index: 5;
  pointer-events: none;
}
.corner.tl { top: 24px; left: 24px; border-right: none; border-bottom: none; }
.corner.tr { top: 24px; right: 24px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 24px; left: 24px; border-right: none; border-top: none; }
.corner.br { bottom: 24px; right: 24px; border-left: none; border-top: none; }

.topbar {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: rgba(150,180,230,.55);
  z-index: 5;
}
.topbar .pip {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #4a8fff;
  box-shadow: 0 0 8px #4a8fff;
  animation: pip 2.2s ease-in-out infinite;
}
@keyframes pip {
  0%, 100% { opacity: .35; transform: scale(.85); }
  50%      { opacity: 1;   transform: scale(1.15); }
}

.content {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(640px, 90vw);
  text-align: center;
  z-index: 5;
}

.title {
  font-size: clamp(26px, 3.4vw, 40px);
  line-height: 1.2;
  font-weight: 300;
  letter-spacing: -0.8px;
  color: #eaf0ff;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .5s ease, transform .5s ease, filter .5s ease;
}
.title.changing {
  opacity: 0;
  transform: translateY(6px);
  filter: blur(4px);
}
.title .accent {
  background: linear-gradient(90deg, #ffffff 0%, #a8c4ff 50%, #ffffff 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  animation: shimmer 7s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }

.subtitle {
  margin-top: 14px;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .3px;
  color: rgba(150,175,215,.55);
  transition: opacity .6s ease;
}

.ia-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 22px;
  padding: 5px 12px 5px 9px;
  border: 1px solid rgba(100,150,220,.14);
  border-radius: 100px;
  background: rgba(66,133,244,.03);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(170,200,245,.68);
  white-space: nowrap;
  transition: opacity .6s ease;
}
.ia-atom {
  position: relative;
  width: 14px; height: 14px;
  flex-shrink: 0;
}
.ia-atom::before,
.ia-atom::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid rgba(120,170,255,.55);
  border-radius: 50%;
}
.ia-atom::before { transform: scaleY(.38); animation: atomA 3s linear infinite; }
.ia-atom::after  { transform: scaleX(.38) rotate(60deg); animation: atomB 3.6s linear infinite; }
.ia-atom .ia-core {
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: #8cc8ff;
  box-shadow: 0 0 6px #8cc8ff, 0 0 10px rgba(90,150,255,.75);
  animation: coreFlicker 2.2s ease-in-out infinite;
}
@keyframes atomA { to { transform: scaleY(.38) rotate(360deg); } }
@keyframes atomB { to { transform: scaleX(.38) rotate(360deg) rotate(60deg); } }
@keyframes coreFlicker { 0%,100% { opacity: .7; } 50% { opacity: 1; } }

/* Log */
.log-block {
  width: min(520px, 100%);
  margin: 42px auto 0;
  text-align: left;
}
.log-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: rgba(150,180,230,.5);
  padding-bottom: 10px;
}
.log-head .pct {
  color: rgba(200,220,255,.88);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.log-rail {
  position: relative;
  width: 100%;
  height: 1px;
  background: rgba(120,150,220,.08);
  border-radius: 1px;
  overflow: hidden;
  margin-bottom: 22px;
}
.log-fill {
  position: absolute;
  left: 0; top: 0;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #2d5fd9, #6aa8ff, #b8dfff);
  box-shadow: 0 0 6px rgba(90,150,255,.55);
  border-radius: 1px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
}

.log-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.log-line {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: "Courier New", monospace;
  font-size: 11.5px;
  letter-spacing: .3px;
  color: rgba(150,175,215,.2);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .7s ease, transform .7s ease, color .7s ease;
}
.log-line.visible { opacity: 1; transform: translateY(0); }
.log-line .chev {
  flex-shrink: 0;
  width: 12px;
  text-align: center;
  color: rgba(120,160,230,.3);
  transition: color .5s ease, transform .5s ease;
  font-size: 11px;
  line-height: 1;
}
.log-line.active { color: rgba(232,242,255,.98); }
.log-line.active .chev {
  color: #8cc8ff;
  font-size: 13px;
  animation: chevPulse 1.6s ease-in-out infinite;
}
@keyframes chevPulse {
  0%, 100% { opacity: .55; transform: translateX(0); }
  50%      { opacity: 1;   transform: translateX(2px); }
}
.log-line.done { color: rgba(150,175,215,.22); }
.log-line.done .chev {
  color: rgba(100,180,240,.5);
  font-size: 9px;
}

/* Linha final — "abrindo ambiente" com pontinhos */
.log-line.final {
  color: rgba(210,230,255,.9);
  font-weight: 400;
}
.log-line.final .chev {
  color: #8cc8ff;
  font-size: 11px;
  animation: chevPulse 1.6s ease-in-out infinite;
}

/* Pontinhos animados depois do texto */
.dots-load {
  display: inline-flex;
  gap: 3px;
  margin-left: 6px;
  vertical-align: middle;
  transform: translateY(-1px);
}
.dots-load i {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #8cc8ff;
  box-shadow: 0 0 6px rgba(140,200,255,.9);
  animation: dotLoad 1.4s ease-in-out infinite;
}
.dots-load i:nth-child(2) { animation-delay: .2s; }
.dots-load i:nth-child(3) { animation-delay: .4s; }
@keyframes dotLoad {
  0%, 100% { opacity: .15; transform: scale(.7); }
  50%      { opacity: 1;   transform: scale(1.15); }
}

.bottombar {
  position: absolute;
  left: 40px; right: 40px;
  bottom: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: .5px;
  color: rgba(120,150,200,.32);
  z-index: 5;
}
.bottombar .left {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.bottombar .left::before {
  content: "";
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #4a8fff;
  box-shadow: 0 0 6px #4a8fff;
  animation: pip 2.2s ease-in-out infinite;
}

@media (max-width: 640px) {
  .corner { width: 16px; height: 16px; }
  .corner.tl, .corner.tr { top: 16px; }
  .corner.bl, .corner.br { bottom: 16px; }
  .corner.tl, .corner.bl { left: 16px; }
  .corner.tr, .corner.br { right: 16px; }
  .topbar { top: 30px; font-size: 9px; letter-spacing: 2.5px; }
  .title { font-size: 23px; min-height: 46px; }
  .subtitle { font-size: 12px; }
  .log-block { margin-top: 32px; }
  .log-list { gap: 8px; }
  .log-line { font-size: 11px; gap: 10px; }
  .bottombar { left: 24px; right: 24px; bottom: 26px; font-size: 9px; }
}
</style>
</head>

<body>

<div class="screen" id="screen">

  <canvas id="dotGrid"></canvas>
  <div class="aura" id="aura"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="topbar">
    <span class="pip"></span>
    <span>Sistema · Iniciando</span>
  </div>

  <main class="content">

    <div class="title" id="title">
      <span class="accent">Estamos preparando tudo para você</span>
    </div>

    <div class="subtitle" id="subtitle">Isso leva apenas alguns segundos</div>

    <div class="ia-chip">
      <span class="ia-atom"><span class="ia-core"></span></span>
      <span>IA processando</span>
    </div>

    <div class="log-block">
      <div class="log-head">
        <span class="label" id="progressLabel">Preparando ambiente</span>
        <span class="pct" id="pctNum">0%</span>
      </div>
      <div class="log-rail">
        <div class="log-fill" id="logFill"></div>
      </div>
      <div class="log-list" id="logList"></div>
    </div>

  </main>

  <div class="bottombar">
    <span class="left">ia://prepare · v1.0</span>
    <span id="clock">--:--:--</span>
  </div>

</div>

<script>
/* =========================================================
   BASE
========================================================= */
const $ = (id) => document.getElementById(id);
const DPR = Math.min(window.devicePixelRatio || 1, 2);

/* URL de destino — TROQUE AQUI */
const URL_DESTINO = "telameuscursos.php";

/* Relógio */
const clockEl = $("clock");
function tickClock() {
  const d = new Date();
  clockEl.textContent =
    String(d.getHours()).padStart(2,"0") + ":" +
    String(d.getMinutes()).padStart(2,"0") + ":" +
    String(d.getSeconds()).padStart(2,"0");
}
tickClock();
setInterval(tickClock, 1000);

/* =========================================================
   FUNDO — malha de pontos
========================================================= */
const canvas = $("dotGrid");
const ctx = canvas.getContext("2d");
let W, H, cx, cy;

const DOT_SPACING = 38;
const PULSE_WIDTH = 110;
const PULSE_SPEED = 2.2;
const PULSE_MAX_R = 1400;
const PULSE_EVERY = 3800;

let dots = [];
const pulses = [];
let reactivity = 0;

function resize() {
  W = canvas.width  = window.innerWidth  * DPR;
  H = canvas.height = window.innerHeight * DPR;
  canvas.style.width  = window.innerWidth  + "px";
  canvas.style.height = window.innerHeight + "px";
  cx = W / 2;
  cy = H / 2;
  buildDots();
}

function buildDots() {
  dots = [];
  const spacing = DOT_SPACING * DPR;
  const cols = Math.ceil(W / spacing) + 2;
  const rows = Math.ceil(H / spacing) + 2;
  const offX = (W - (cols - 1) * spacing) / 2;
  const offY = (H - (rows - 1) * spacing) / 2;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      dots.push({
        x: offX + c * spacing,
        y: offY + r * spacing,
        r: 1.0 * DPR,
        phase: Math.random() * Math.PI * 2,
        bias: Math.random() * .35 + .15,
      });
    }
  }
}

function spawnPulse() {
  const fromCenter = Math.random() < 0.55;
  const px = fromCenter ? cx : (Math.random() * W);
  const py = fromCenter ? cy : (Math.random() * H);

  const roll = Math.random();
  let color;
  if (roll < .82)      color = [100, 170, 255];
  else if (roll < .96) color = [120, 220, 255];
  else                 color = [170, 130, 255];

  pulses.push({
    x: px, y: py,
    radius: 0,
    opacity: 1,
    color,
    strength: Math.random() < .2 ? 1.35 : 1,
  });
}

setTimeout(spawnPulse, 500);
setInterval(spawnPulse, PULSE_EVERY);

let t = 0;

function render() {
  ctx.clearRect(0, 0, W, H);
  t += 0.016;

  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.radius += PULSE_SPEED * DPR;
    p.opacity = Math.max(0, 1 - p.radius / (PULSE_MAX_R * DPR));
    if (p.radius > PULSE_MAX_R * DPR || p.opacity <= 0.01) {
      pulses.splice(i, 1);
    }
  }

  const baseAlphaBase = 0.05 + reactivity * 0.06;
  const baseR = 1.0 + reactivity * 0.35;

  for (const dot of dots) {
    const breath = 0.85 + Math.sin(t * 0.55 + dot.phase) * 0.15;

    let lit = 0;
    let litColor = null;
    for (const p of pulses) {
      const dx = dot.x - p.x;
      const dy = dot.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const diff = Math.abs(dist - p.radius);
      if (diff < PULSE_WIDTH * DPR) {
        const intensity =
          (1 - diff / (PULSE_WIDTH * DPR)) * p.opacity * p.strength;
        if (intensity > lit) {
          lit = intensity;
          litColor = p.color;
        }
      }
    }

    if (lit > 0.02 && litColor) {
      const [r, g, b] = litColor;
      if (lit > 0.35) {
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.r * 4.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${(lit - 0.35) * 0.22})`;
        ctx.fill();
      }
      const coreAlpha = 0.14 + Math.min(1, lit) * 0.86;
      const mixR = Math.round(100 + (200 - 100) * Math.min(1, lit));
      const mixG = Math.round(140 + (235 - 140) * Math.min(1, lit));
      const mixB = Math.round(210 + (255 - 210) * Math.min(1, lit));
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.r * (1 + Math.min(1, lit) * 0.6), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${mixR}, ${mixG}, ${mixB}, ${coreAlpha})`;
      ctx.fill();
    } else {
      const alpha = baseAlphaBase * dot.bias * breath;
      const rr = dot.r * baseR;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, rr, 0, Math.PI * 2);
      const cr = Math.round(110 + reactivity * 40);
      const cg = Math.round(150 + reactivity * 35);
      const cb = Math.round(220 + reactivity * 20);
      ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${alpha})`;
      ctx.fill();
    }
  }

  requestAnimationFrame(render);
}

resize();
window.addEventListener("resize", resize);
render();

/* =========================================================
   LOG
========================================================= */
const LOG_LINES = [
  { text: "iniciando assistente",    at: 0  },
  { text: "carregando preferências", at: 14 },
  { text: "analisando perfil",       at: 28 },
  { text: "configurando interface",  at: 44 },
  { text: "preparando recursos",     at: 62 },
  { text: "otimizando desempenho",   at: 78 },
  { text: "sincronizando dados",     at: 88 },
  { text: "finalizando ambiente",    at: 96 },
];

const logListEl = $("logList");
const logLineEls = [];

LOG_LINES.forEach((line) => {
  const el = document.createElement("div");
  el.className = "log-line";
  el.innerHTML = `
    <span class="chev">›</span>
    <span class="lt">${line.text}</span>
  `;
  logListEl.appendChild(el);
  logLineEls.push(el);
});

function updateLog(progress) {
  let currentIdx = -1;

  for (let i = LOG_LINES.length - 1; i >= 0; i--) {
    if (progress >= LOG_LINES[i].at) {
      currentIdx = i;
      break;
    }
  }

  for (let i = 0; i < LOG_LINES.length; i++) {
    const el = logLineEls[i];
    const at = LOG_LINES[i].at;
    const nextAt = (i + 1 < LOG_LINES.length) ? LOG_LINES[i + 1].at : 101;
    const chev = el.querySelector(".chev");

    if (progress >= at) el.classList.add("visible");

    if (progress >= nextAt) {
      el.classList.remove("active");
      el.classList.add("done");
      chev.textContent = "✓";
    } else if (i === currentIdx) {
      el.classList.remove("done");
      el.classList.add("active");
      chev.textContent = "›";
    } else {
      el.classList.remove("active", "done");
      chev.textContent = "›";
    }
  }
}

/* Cria uma linha adicional (usada no final) */
function criarLinha(texto, extraHTML = "") {
  const el = document.createElement("div");
  el.className = "log-line";
  el.innerHTML = `
    <span class="chev">›</span>
    <span class="lt">${texto}${extraHTML}</span>
  `;
  logListEl.appendChild(el);
  // Força um reflow pra animação de entrada funcionar
  requestAnimationFrame(() => {
    el.classList.add("visible");
  });
  return el;
}

/* =========================================================
   MENSAGEM PRINCIPAL
========================================================= */
const messages = [
  "Estamos preparando tudo para você",
  "Aguarde apenas alguns instantes",
  "Estamos organizando seu ambiente",
  "Configurando sua experiência",
  "Preparando seus recursos",
  "Ajustando tudo para você",
  "Quase tudo pronto",
  "Finalizando seu ambiente",
];

const titleEl = $("title");
let msgIndex = 0;

function changeMessage(text) {
  titleEl.classList.add("changing");
  setTimeout(() => {
    titleEl.innerHTML = `<span class="accent">${text}</span>`;
    titleEl.classList.remove("changing");
  }, 450);
}

function updateMessageByProgress(v) {
  let i;
  if      (v < 12) i = 0;
  else if (v < 24) i = 1;
  else if (v < 38) i = 2;
  else if (v < 52) i = 3;
  else if (v < 68) i = 4;
  else if (v < 84) i = 5;
  else if (v < 96) i = 6;
  else             i = 7;

  if (i !== msgIndex) {
    msgIndex = i;
    changeMessage(messages[i]);
  }
}

/* =========================================================
   PROGRESSO
========================================================= */
const pctNum      = $("pctNum");
const progressLbl = $("progressLabel");
const logFill     = $("logFill");
const aura        = $("aura");

let progress = 0;
let finished = false;

const progTimer = setInterval(() => {
  let inc;
  if      (progress < 75) inc = Math.random() * 1.6 + .4;
  else if (progress < 92) inc = Math.random() * 1.0 + .2;
  else                    inc = Math.random() * .5 + .06;

  progress += inc;

  if (progress >= 100) {
    progress = 100;
    clearInterval(progTimer);
    if (!finished) { finished = true; fechar(); }
  }

  pctNum.textContent = Math.floor(progress) + "%";
  logFill.style.width = progress + "%";
  updateLog(progress);
  updateMessageByProgress(progress);

  const r = progress / 100;
  reactivity = r;
  aura.style.opacity = String(0.15 + r * 0.75);

  if      (progress < 20) progressLbl.textContent = "Preparando ambiente";
  else if (progress < 40) progressLbl.textContent = "Analisando configurações";
  else if (progress < 55) progressLbl.textContent = "Configurando experiência";
  else if (progress < 70) progressLbl.textContent = "Personalizando ambiente";
  else if (progress < 85) progressLbl.textContent = "Organizando recursos";
  else if (progress < 96) progressLbl.textContent = "Finalizando preparação";
  else                    progressLbl.textContent = "Finalizando ambiente";
}, 300);

/* =========================================================
   FECHAMENTO — o log termina sozinho e redireciona
========================================================= */
function fechar() {
  progress = 100;
  pctNum.textContent = "100%";
  logFill.style.width = "100%";
  progressLbl.textContent = "Concluído";

  // Fecha todas as linhas já existentes
  logLineEls.forEach((el) => {
    el.classList.add("visible");
    el.classList.remove("active");
    el.classList.add("done");
    el.querySelector(".chev").textContent = "✓";
  });

  // Título final — muda suavemente
  changeMessage("Tudo pronto.");

  // 1) linha "pronto"
  setTimeout(() => {
    const linhaPronto = criarLinha("pronto");
    linhaPronto.classList.add("done");
    linhaPronto.querySelector(".chev").textContent = "✓";
  }, 900);

  // 2) linha "abrindo ambiente..." com pontinhos animados
  setTimeout(() => {
    const dotsHTML = `<span class="dots-load"><i></i><i></i><i></i></span>`;
    const linhaFinal = criarLinha("abrindo ambiente", dotsHTML);
    linhaFinal.classList.add("final", "active");
  }, 2000);

  // 3) fade + redirect
  setTimeout(() => {
    $("screen").classList.add("finish");
  }, 5200);

  setTimeout(() => {
    window.location.href = URL_DESTINO;
  }, 6100);
}
</script>

</body>
</html>
